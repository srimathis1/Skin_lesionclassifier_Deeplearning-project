<!DOCTYPE html>
<html>
<head>
    <title>Skin Cancer Detection</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef2f3, #dfe9f3);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            margin-top: 60px;
        }

        .card {
            background: #ffffff;
            width: 420px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input[type="file"] {
            margin: 10px 0;
        }

        select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 80%;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            background: #4CAF50;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        .preview {
            margin-top: 20px;
        }

        .preview img {
            width: 220px;
            border-radius: 10px;
            border: 2px solid #eee;
        }

        .results {
            margin-top: 20px;
        }

        .result-box {
            background: #f1f8f4;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 16px;
        }

        .highlight {
            color: #d32f2f;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h2>Skin Lesion Classifier</h2>

        <form method="POST" enctype="multipart/form-data">
            
            <input type="file" name="image" required><br>

            <select name="model_choice" required>
                <option value="">Choose Model</option>
                <option value="mobilenet">MobileNet</option>
                <option value="vit">Vision Transformer</option>
                <option value="both">Compare Both</option>
            </select><br>

            <button type="submit">Analyze Image</button>
        </form>

        <!-- IMAGE PREVIEW -->
        {% if image_data %}
        <div class="preview">
            <h4>Uploaded Image</h4>
            <img src="data:image/png;base64,{{ image_data }}">
        </div>
        {% endif %}

        <!-- RESULTS -->
        <div class="results">

            {% if result1 %}
            <div class="result-box">
                {{ result1 }}
            </div>
            {% endif %}

            {% if result2 %}
            <div class="result-box">
                {{ result2 }}
            </div>
            {% endif %}

        </div>

    </div>

    <footer>
        Deep Learning based Skin Lesion Detection • MobileNet vs ViT
    </footer>
</div>

</body>
</html>
